project_id = "kalidash-academy"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5173/redefinir-senha"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
# Em produção, ligue a confirmação de e-mail no painel do Supabase.
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.create-mux-upload]
verify_jwt = true

[functions.get-video-playback-token]
verify_jwt = true

[functions.get-material-download]
verify_jwt = true

[functions.delete-mux-video]
verify_jwt = true

# O Mux não manda JWT do Supabase. A autenticidade vem da assinatura HMAC,
# verificada dentro da própria função.
[functions.mux-webhook]
verify_jwt = false
